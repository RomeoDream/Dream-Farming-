name: LSL compile and behavior tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lsl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/build.py --check
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cloudflare/tests/*.test.mjs
      - run: python tools/package_beta.py
      - uses: actions/upload-artifact@v4
        with:
          name: Dream-Farming-SL-Test-Candidate
          path: dist/Dream-Farming-SL-Test-Candidate.zip
