name: Equine regression checks
on:
  push:
    paths:
      - 'src/**'
      - 'lsl/**'
      - 'experimental/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/equine-regression.yml'
  pull_request:
  workflow_dispatch:
jobs:
  equine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify generated LSL
        run: python tools/build.py --check
      - name: Run equine source regression tests
        run: python -m unittest discover -s tests -p 'test_equine_source.py' -v
