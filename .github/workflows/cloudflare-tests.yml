name: Farm Cloudflare bridge regression tests
on:
  push:
    paths:
      - 'cloudflare/src/**'
      - 'cloudflare/tests/**'
      - '.github/workflows/cloudflare-tests.yml'
  pull_request:
    paths:
      - 'cloudflare/src/**'
      - 'cloudflare/tests/**'
      - '.github/workflows/cloudflare-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check cloudflare/src/index.js
      - run: node --test cloudflare/tests/*.test.mjs
